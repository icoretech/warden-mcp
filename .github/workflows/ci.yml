name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.5
          cache: npm

      - name: Set up npm
        run: npm install --global "npm@$(node -p 'require("./package.json").engines.npm')"

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx biome check .

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node --test "dist/**/*.test.js"

      - name: Test server and plugin release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action=$(yq -er '.jobs."release-please".steps[] | select(.id == "release") | .uses' .github/workflows/release-please.yml)
          version=$(gh api --method GET repos/googleapis/release-please-action/contents/package-lock.json \
            -f "ref=${action##*@}" -H 'Accept: application/vnd.github.raw+json' \
            --jq '.packages["node_modules/release-please"].version')
          npm install --prefix "${RUNNER_TEMP}/release-contract" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "release-please@${version}"
          NODE_PATH="${RUNNER_TEMP}/release-contract/node_modules" node --test .github/tests/release-tags.test.cjs

      - name: Lint workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  integration-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: run docker-compose integration smoke
        run: |
          docker compose up -d vaultwarden vaultwarden-https
          docker compose run --rm bootstrap
          docker compose run --rm tests
          docker compose run --rm tests-apikey

      - name: dump compose logs
        if: always()
        run: docker compose logs --no-color || true

      - name: tear down compose stack
        if: always()
        run: docker compose down -v --remove-orphans
